<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgLagoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A4A57"/>
      <stop offset="60%" stop-color="#143942"/>
      <stop offset="100%" stop-color="#0E282E"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D6370"/>
      <stop offset="100%" stop-color="#13363F"/>
    </linearGradient>
    <linearGradient id="goldMughal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EED798"/>
      <stop offset="50%" stop-color="#C5A15E"/>
      <stop offset="100%" stop-color="#9E7D3B"/>
    </linearGradient>
    <filter id="lotusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Teal / Blue Sky & Lagoon Background -->
  <rect width="800" height="500" fill="url(#bgLagoon)"/>

  <!-- Ornate Mughal Scalloped Arch Framing (The signature Balcony Lotus Lagoon look) -->
  <path d="M 80,0 L 80,180 
           C 80,180 120,240 200,240 
           C 280,240 320,170 400,110 
           C 480,170 520,240 600,240 
           C 680,240 720,180 720,180 
           L 720,0 Z" 
        fill="#0D2329" opacity="0.6"/>

  <!-- Outer Traditional Arch Contour -->
  <path d="M 120,0 L 120,170
           Q 120,220 180,220
           Q 260,220 300,160
           Q 350,90 400,75
           Q 450,90 500,160
           Q 540,220 620,220
           Q 680,220 680,170
           L 680,0 Z"
        fill="none" stroke="url(#goldMughal)" stroke-width="2.5"/>

  <!-- Delicate Hanging Gold Floral Bells in Corners -->
  <g fill="none" stroke="url(#goldMughal)" stroke-width="1.5">
    <path d="M 140,20 C 140,70 170,80 170,120"/>
    <circle cx="170" cy="125" r="5" fill="#EED798"/>
    <path d="M 660,20 C 660,70 630,80 630,120"/>
    <circle cx="630" cy="125" r="5" fill="#EED798"/>
  </g>

  <!-- Inner Soft Sand/Cream Card Panel -->
  <g filter="url(#lotusGlow)">
    <path d="M 190,40 L 610,40
             L 610,340
             L 190,340 Z"
          fill="#F7F1E5" opacity="0.95"/>
    <!-- Intricate Inset Gold Border -->
    <rect x="202" y="52" width="396" height="276" fill="none" stroke="#C5A15E" stroke-width="1.2"/>
    <rect x="208" y="58" width="384" height="264" fill="none" stroke="#A8B59C" stroke-width="0.8" stroke-dasharray="3 3"/>
  </g>

  <!-- Rajasthani White Marble Balustrade Jali (Railing) -->
  <g fill="#EFE9DC" stroke="#C5A15E" stroke-width="0.8">
    <rect x="180" y="325" width="440" height="15" fill="#EAE2D1"/>
    <!-- Jali posts -->
    <rect x="190" y="310" width="12" height="15"/>
    <rect x="230" y="310" width="12" height="15"/>
    <rect x="270" y="310" width="12" height="15"/>
    <rect x="310" y="310" width="12" height="15"/>
    <rect x="350" y="310" width="12" height="15"/>
    <rect x="390" y="310" width="12" height="15"/>
    <rect x="430" y="310" width="12" height="15"/>
    <rect x="470" y="310" width="12" height="15"/>
    <rect x="510" y="310" width="12" height="15"/>
    <rect x="550" y="310" width="12" height="15"/>
    <rect x="590" y="310" width="12" height="15"/>
  </g>

  <!-- Botanical Card Typography: Exactly as in Loom Video (Dulhan and Dulha) -->
  <text x="400" y="115" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#596B57">
    THE BOTANICAL COLLECTION
  </text>

  <text x="400" y="175" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="600" font-style="italic" fill="#143942" letter-spacing="1">
    Dulhan
  </text>
  
  <text x="400" y="215" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-style="italic" fill="#C5A15E">
    and
  </text>
  
  <text x="400" y="270" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="600" font-style="italic" fill="#143942" letter-spacing="1">
    Dulha
  </text>

  <!-- Subtext -->
  <text x="400" y="300" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" letter-spacing="2" fill="#596B57">
    LOTUS LAGOON · SAGE &amp; IVORY
  </text>

  <!-- Water Ripples & Water Surface -->
  <path d="M 0,340 Q 200,320 400,340 T 800,340 L 800,500 L 0,500 Z" fill="url(#waterGrad)"/>
  <path d="M 0,380 Q 200,365 400,380 T 800,380 L 800,500 L 0,500 Z" fill="#102E35" opacity="0.6"/>

  <!-- Floating Blooming Pink Lotus Flowers & Lily Pads (Signature Balcony Lotus Elements) -->
  <g>
    <!-- Left Lotus Pad -->
    <ellipse cx="140" cy="430" rx="65" ry="18" fill="#477353"/>
    <ellipse cx="140" cy="430" rx="50" ry="14" fill="#5E966E"/>
    <!-- Left Lotus Bloom -->
    <g transform="translate(140, 400)">
      <path d="M -25,20 C -30,0 -10,-15 0,-25 C 10,-15 30,0 25,20 Z" fill="#F4A6BE"/>
      <path d="M -15,20 C -20,5 -5,-8 0,-18 C 5,-8 20,5 15,20 Z" fill="#FAD1DF"/>
      <path d="M -8,20 C -10,10 0,0 0,-12 C 0,0 10,10 8,20 Z" fill="#FFF0F5"/>
      <circle cx="0" cy="12" r="4" fill="#FFD700"/>
    </g>

    <!-- Center Left Lotus Bloom -->
    <ellipse cx="280" cy="460" rx="55" ry="16" fill="#3D6648"/>
    <g transform="translate(280, 435)">
      <path d="M -22,18 C -26,0 -8,-12 0,-22 C 8,-12 26,0 22,18 Z" fill="#F4A6BE"/>
      <path d="M -12,18 C -16,4 -4,-6 0,-15 C 4,-6 16,4 12,18 Z" fill="#FAD1DF"/>
      <circle cx="0" cy="10" r="3.5" fill="#FFD700"/>
    </g>

    <!-- Center Right Lotus Bloom -->
    <ellipse cx="520" cy="460" rx="55" ry="16" fill="#3D6648"/>
    <g transform="translate(520, 435)">
      <path d="M -22,18 C -26,0 -8,-12 0,-22 C 8,-12 26,0 22,18 Z" fill="#F4A6BE"/>
      <path d="M -12,18 C -16,4 -4,-6 0,-15 C 4,-6 16,4 12,18 Z" fill="#FAD1DF"/>
      <circle cx="0" cy="10" r="3.5" fill="#FFD700"/>
    </g>

    <!-- Right Lotus Pad & Bloom -->
    <ellipse cx="660" cy="430" rx="65" ry="18" fill="#477353"/>
    <ellipse cx="660" cy="430" rx="50" ry="14" fill="#5E966E"/>
    <g transform="translate(660, 400)">
      <path d="M -25,20 C -30,0 -10,-15 0,-25 C 10,-15 30,0 25,20 Z" fill="#F4A6BE"/>
      <path d="M -15,20 C -20,5 -5,-8 0,-18 C 5,-8 20,5 15,20 Z" fill="#FAD1DF"/>
      <path d="M -8,20 C -10,10 0,0 0,-12 C 0,0 10,10 8,20 Z" fill="#FFF0F5"/>
      <circle cx="0" cy="12" r="4" fill="#FFD700"/>
    </g>
  </g>
</svg>